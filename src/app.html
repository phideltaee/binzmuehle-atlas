<title>Binzmühle Quartier-Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a Swiss competition model of Affoltern and Oerlikon fills the screen (plaster city on a model board,
   the new Binzmühle rows set in as birch wood). A left rail holds the masthead and a tabbed guide; a place card opens on
   the right; on phones the guide becomes a bottom sheet. Pins and the UI share one category palette. */
:root{
  --table:#DCD8CF; --table-2:#ECE9E2; --paper:#FBFAF7; --paper-2:#F1EFE9; --ink:#1B1F1D; --muted:#5C6460; --line:#DDD9D0;
  --birch:#B07C3F; --birch-soft:#F3E7D4; --accent:#2747A8; --accent-soft:#E3E9F9; --on-accent:#FFFFFF;
  --c-kita:#D2456E; --c-school:#7E55C4; --c-play:#DB8E12; --c-green:#3C9257; --c-sport:#1F86C2; --c-culture:#C9452F;
  --c-food:#A26E1C; --c-community:#13948B; --c-health:#A9479A; --c-mobility:#4D5866; --c-recycle:#5F8127; --c-water:#2D8FD1;
  --shadow:0 12px 32px rgba(40,34,24,.14),0 1px 2px rgba(40,34,24,.10);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px; --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --table:#0C0F0E; --table-2:#161B19; --paper:#171C1A; --paper-2:#1F2523; --ink:#E7ECE8; --muted:#9AA59F; --line:#2B3330;
  --birch:#DEA866; --birch-soft:#392B19; --accent:#9DB2F6; --accent-soft:#1D2849; --on-accent:#0B1430;
  --c-kita:#F06E93; --c-school:#A98AE6; --c-play:#F2B54A; --c-green:#62B97C; --c-sport:#4FB0E8; --c-culture:#EE6B54;
  --c-food:#D59E45; --c-community:#3CC2B8; --c-health:#D774C3; --c-mobility:#A6B2C2; --c-recycle:#93B655; --c-water:#62B6EE;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --table:#0C0F0E; --table-2:#161B19; --paper:#171C1A; --paper-2:#1F2523; --ink:#E7ECE8; --muted:#9AA59F; --line:#2B3330;
  --birch:#DEA866; --birch-soft:#392B19; --accent:#9DB2F6; --accent-soft:#1D2849; --on-accent:#0B1430;
  --c-kita:#F06E93; --c-school:#A98AE6; --c-play:#F2B54A; --c-green:#62B97C; --c-sport:#4FB0E8; --c-culture:#EE6B54;
  --c-food:#D59E45; --c-community:#3CC2B8; --c-health:#D774C3; --c-mobility:#A6B2C2; --c-recycle:#93B655; --c-water:#62B6EE;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
/* By day the interface is warm cream paper; at night (the city switched to night) it goes dark with the model. */
:root[data-theme="cream"]{
  --table:#DCD8CF; --table-2:#ECE9E2; --paper:#F7F1E5; --paper-2:#EEE5D2; --ink:#2A241B; --muted:#6E6455; --line:#E1D4BC;
  --birch:#A56B28; --birch-soft:#F0DFC1; --accent:#2B4C9B; --accent-soft:#E1E5F1; --on-accent:#FFFFFF;
  --c-kita:#D2456E; --c-school:#7E55C4; --c-play:#DB8E12; --c-green:#3C9257; --c-sport:#1F86C2; --c-culture:#C9452F;
  --c-food:#A26E1C; --c-community:#13948B; --c-health:#A9479A; --c-mobility:#4D5866; --c-recycle:#5F8127; --c-water:#2D8FD1;
  --shadow:0 14px 34px rgba(72,52,22,.20),0 1px 2px rgba(72,52,22,.14); color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
#app{position:relative;height:100%;padding-left:var(--gl);padding-right:var(--gr);padding-block:0;--scene:#DCD8CF;--scene-2:#ECE9E2;
  background:radial-gradient(120% 90% at 55% 45%,var(--scene-2) 0%,var(--scene) 70%)}
#app[data-night]{--scene:#0C0F0E;--scene-2:#161B19}
/* The model and its labels stay in daylight unless the visitor switches the city to night. */
:root[data-theme="dark"] #app:not([data-night]) #labels{--paper:#FBFAF7;--paper-2:#F1EFE9;--ink:#1B1F1D;--muted:#5C6460;--line:#DDD9D0;--birch:#B07C3F;--birch-soft:#F3E7D4;--accent:#2747A8;--on-accent:#FFFFFF}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#gl.pick{cursor:crosshair}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.card{background:color-mix(in srgb,var(--paper) 76%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);
  border:1px solid color-mix(in srgb,#fff 50%,transparent);border-radius:var(--r);box-shadow:var(--shadow)}
:root[data-theme="dark"] .card{border-color:color-mix(in srgb,#fff 10%,transparent)}
:root[data-lowfx] .card{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line)}
@media (prefers-reduced-transparency:reduce){.card{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none;border-color:var(--line)}}
.ov{position:absolute;z-index:3}

/* ---------- 3D labels ---------- */
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;will-change:transform}
.lb.poi{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;border-radius:999px;background:var(--paper);
  border:1px solid var(--line);font:600 11.5px/1.2 var(--f-ui);color:var(--ink);box-shadow:0 2px 8px rgba(30,26,20,.14);pointer-events:auto;cursor:pointer;margin-top:-6px}
.lb.poi i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lb.poi.sel{z-index:2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lb.poi small{font:500 10px var(--f-num);color:var(--muted)}
.lb.poi.sel small{color:inherit;opacity:.75}
.lb.site{z-index:3;padding:4px 10px;border-radius:8px;background:var(--birch);color:var(--paper);font:700 12px/1.15 var(--f-display);letter-spacing:.01em;pointer-events:auto;cursor:pointer;box-shadow:0 3px 10px rgba(80,50,10,.25);margin-top:-8px}
.lb.site small{display:block;font:500 10px var(--f-num);opacity:.85}
.lb.sites{padding:2px 7px;border-radius:6px;background:var(--birch-soft);color:var(--birch);border:1px solid color-mix(in srgb,var(--birch) 35%,transparent);font:600 10.5px var(--f-ui);pointer-events:auto;cursor:pointer}
.lb.station{padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--paper);font:600 11px var(--f-ui)}
.lb.place{font:italic 500 11px/1.2 var(--f-display);color:var(--muted);text-shadow:0 0 3px var(--paper),0 0 6px var(--paper);transform:translate(-50%,-50%)}
.lb.ring{font:600 10px var(--f-num);color:var(--muted);background:var(--paper);padding:1px 6px;border-radius:5px;border:1px solid var(--line);transform:translate(-50%,-50%)}
.lb.stop{font:600 10px var(--f-ui);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.lb.num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 11px var(--f-num);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lb.band{display:grid;gap:3px;font:600 10.5px var(--f-ui);padding:6px 9px 6px 7px;border-radius:8px;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(30,26,20,.14);transform:translate(0,-50%)}
.lb.band div{display:flex;align-items:center;gap:6px}
.lb.band i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.lb.poi.hl{border-color:var(--birch);box-shadow:0 0 0 2px color-mix(in srgb,var(--birch) 30%,transparent),0 2px 8px rgba(30,26,20,.14)}
.lb.poi.hl small{color:var(--birch)}
.lb.evt{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--birch);color:var(--paper);font:600 11.5px/1.2 var(--f-ui);box-shadow:0 3px 10px rgba(80,50,10,.25);pointer-events:auto;cursor:pointer;margin-top:-6px}
.lb.evt b{font:700 10px var(--f-num);background:var(--paper);color:var(--birch);border-radius:999px;padding:2px 6px}

/* ---------- left rail ---------- */
.rail{position:absolute;z-index:4;top:calc(14px + env(safe-area-inset-top,0px));left:var(--gl);bottom:14px;width:384px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.rail>*{pointer-events:auto}
/* the flight around the estate starts only when asked */
.flybtn{flex:0 0 auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:600 12.5px var(--f-ui);box-shadow:var(--shadow);cursor:pointer}
.flybtn i{width:24px;height:24px;border-radius:50%;background:var(--birch);color:var(--paper);display:grid;place-items:center;flex:0 0 auto}
.flybtn i svg{width:13px;height:13px}
.flybtn small{font:500 10.5px var(--f-num);color:var(--muted)}
.flybtn:hover{border-color:var(--birch)}
#app[data-intro] .flybtn{display:none}
.mast{padding:16px 18px 14px;display:grid;gap:6px;flex:0 0 auto}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mast h1{margin:2px 0 0;font:800 40px/0.95 var(--f-display);font-variation-settings:"opsz" 96;letter-spacing:-.03em;text-wrap:balance}
.mast h1 b{color:var(--birch);font-weight:800}
.lead{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45;max-width:46ch}
.stats{margin:4px 0 0;font:500 11px var(--f-num);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.stats b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--paper-2)}
.seg button{border:0;background:transparent;padding:3px 9px;border-radius:7px;font:600 11.5px var(--f-num);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.guide{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0;padding:6px 6px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs button{border:0;background:transparent;padding:9px 4px 10px;font:600 12.5px var(--f-ui);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:4px;align-items:baseline;flex:1 0 auto;justify-content:center}
.tabs button small{font:500 10px var(--f-num);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sheet-handle{display:none}
.panel{overflow:auto;min-height:0;flex:1 1 auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.panel>*{flex-shrink:0}
.panel h3{margin:0;font:700 16px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.panel p{margin:0}
.sh{font:600 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5}

.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper-2)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px}
.search svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 8px;font:600 12px var(--f-ui);cursor:pointer;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip small{font:500 10.5px var(--f-num);color:var(--muted)}
.chip[aria-pressed="false"]{color:var(--muted);background:transparent;border-style:dashed}
.chip[aria-pressed="false"] i{opacity:.35}
.chip.solid[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.solid[aria-pressed="true"] small{color:inherit;opacity:.7}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:600 12px var(--f-ui);cursor:pointer}

.list{display:grid;margin:0 -6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:8px}
.row:hover{background:var(--paper-2)}
.row:last-child{border-bottom:0}
.row i.dot{width:10px;height:10px;border-radius:50%}
.row b{display:block;font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row span.sub{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font:600 11.5px var(--f-num);font-style:normal;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.sel{background:var(--accent-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font:600 12.5px var(--f-ui);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.birch{background:var(--birch);border-color:var(--birch);color:var(--paper)}
.btn svg{width:15px;height:15px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* walks */
.tour{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--paper)}
.tour .top{display:flex;gap:10px;align-items:flex-start}
.tour .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.tour .ico svg{width:18px;height:18px}
.tour .meta{font:500 11px var(--f-num);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tour ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.tour ol li::marker{font:600 11px var(--f-num);color:var(--accent)}

/* agenda */
.months{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;margin:0 -2px}
.months button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 8px 4px;cursor:pointer;display:grid;justify-items:center;line-height:1.1;min-width:46px}
.months button b{font:600 12px var(--f-ui)}
.months button small{font:500 9.5px var(--f-num);color:var(--muted)}
.months button span{font:600 9.5px var(--f-num);color:var(--accent);height:11px}
.months button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.months button[aria-pressed="true"] small,.months button[aria-pressed="true"] span{color:inherit;opacity:.8}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:8px;width:100%}
.ev:hover{background:var(--paper-2)}
.ev .date{border:1px solid var(--line);border-radius:9px;text-align:center;padding:4px 0 3px;background:var(--paper);line-height:1.05}
.ev .date b{display:block;font:700 17px var(--f-display)}
.ev .date small{font:600 9.5px var(--f-num);text-transform:uppercase;color:var(--muted)}
.ev .date.rec b{font-size:12px;font-family:var(--f-num);padding:3px 0}
.ev h4{margin:0;font-size:13px;font-weight:600;line-height:1.3}
.ev p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font:600 9.5px var(--f-ui);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--birch-soft);color:var(--birch);margin-left:6px;vertical-align:1px}
.tag.next{background:var(--accent-soft);color:var(--accent)}

/* highlights (top of the explore tab) */
.hls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hl{display:grid;gap:4px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 10px 9px;cursor:pointer;color:var(--ink);min-width:0}
.hl:hover{border-color:var(--ink)}
.hl .k{display:flex;align-items:center;gap:5px;font:600 9.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--birch)}
.hl .k svg{width:13px;height:13px;flex:0 0 auto}
.hl b{font:700 13px/1.25 var(--f-display);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hl small{font:500 10.5px var(--f-num);color:var(--muted)}

/* involve */
.idea{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.idea .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--birch-soft);color:var(--birch)}
.idea .ico svg{width:17px;height:17px}
.idea h4{margin:0 0 3px;font-size:13.5px;font-weight:700;line-height:1.3}
.idea p{font-size:12.5px;color:var(--muted)}
.idea .linkbtn{margin-top:6px}
.suggest{border:1px dashed var(--birch);border-radius:14px;padding:14px;display:grid;gap:10px;background:color-mix(in srgb,var(--birch-soft) 55%,transparent)}
.field{display:grid;gap:4px}
.field label{font:600 11px var(--f-ui);color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--paper);font-size:13px;width:100%}
pre.snip{margin:0;padding:10px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line);font:500 11px/1.5 var(--f-num);white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}

/* about */
.prose{display:grid;gap:10px;font-size:13px;line-height:1.55}
.prose p{max-width:62ch}
.kv{display:grid;margin:0}
.kv div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* ---------- place card ---------- */
.placecard{top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--gr) + 54px);width:364px;max-height:calc(100% - 96px);overflow:auto;padding:18px 18px 16px;display:grid;gap:12px;align-content:start;z-index:5}
.placecard .close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.placecard .close:hover{background:var(--paper-2);color:var(--ink)}
.placecard .close svg{width:16px;height:16px}
.kick{display:flex;align-items:center;gap:7px;font:600 10.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-right:30px}
.kick i{width:10px;height:10px;border-radius:50%}
.placecard h2{margin:0;font:750 23px/1.12 var(--f-display);letter-spacing:-.02em;text-wrap:balance;padding-right:16px}
.walk{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);font:600 11.5px var(--f-num);font-variant-numeric:tabular-nums}
.pill svg{width:13px;height:13px}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.desc{font-size:13.5px;line-height:1.55}
.addr{font-size:12px;color:var(--muted)}
.lagen{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:stretch}
.tower{width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden;border:1px solid var(--line)}
.tower div{flex:0 0 auto}
.lagen table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.lagen th{font:600 10.5px var(--f-ui);color:var(--muted);text-align:left;padding:3px 4px;border-bottom:1px solid var(--line)}
.lagen td{padding:5px 4px;border-bottom:1px solid var(--line)}
.lagen td.n{text-align:right;font-family:var(--f-num)}
.lagen tr:last-child td{border-bottom:0}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- tools ---------- */
.tools{top:calc(14px + env(safe-area-inset-top,0px));right:var(--gr);display:grid;gap:2px;padding:4px}
.tools button{width:36px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.tools button:hover{background:var(--paper-2)}
.tools button[aria-pressed="true"],.tools button[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.tools svg{width:18px;height:18px}
.tools hr{border:0;border-top:1px solid var(--line);margin:2px 5px}
#compass svg{transition:transform .1s linear}
.layers{top:calc(14px + env(safe-area-inset-top,0px));right:calc(var(--gr) + 54px);width:250px;padding:12px;display:grid;gap:2px;z-index:6}
.layers .lgrp{font:600 10.5px var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:6px 0 2px}
.layers .lgrp:first-child{margin-top:0}
.layers label{display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:7px;cursor:pointer;font-size:13px}
.layers label:hover{background:var(--paper-2)}
.layers label small{margin-left:auto;font:500 10.5px var(--f-num);color:var(--muted)}
.layers input{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;flex:0 0 auto;cursor:pointer;margin:0;transition:background .15s}
.layers input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.layers input:checked{background:var(--accent)}
.layers input:checked::after{transform:translateX(12px)}

.foot a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.foot{right:var(--gr);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;font:500 10.5px var(--f-num);color:var(--muted);background:color-mix(in srgb,var(--paper) 82%,transparent);border-radius:8px;padding:4px 8px;z-index:2}
.scale{display:flex;align-items:center;gap:6px}
.scale i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0;width:80px}

.tourbar{left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 32px - 400px));padding:12px 14px;display:grid;gap:8px;z-index:6;margin-left:200px}
.tourbar .tb-top{display:flex;align-items:center;gap:10px}
.tourbar .tb-top b{font:700 14px var(--f-display);flex:1;min-width:0}
.tourbar .play{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.tourbar .play svg{width:15px;height:15px}
.tourbar .x{width:30px;height:30px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.tourbar .x svg{width:16px;height:16px}
.tourbar .txt{font-size:13px;line-height:1.5;min-height:2.9em}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.legs{display:flex;gap:4px;flex-wrap:wrap}
.legs span{font:600 10.5px var(--f-num);padding:2px 7px;border-radius:6px;background:var(--paper-2);color:var(--muted)}
.legs span.on{background:var(--accent);color:var(--on-accent)}
.legs span.done{background:var(--accent-soft);color:var(--accent)}

/* intro flight: a caption names the highlight in view */
.introcap{left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));margin-left:200px;width:min(520px,calc(100% - 32px - 400px));padding:12px 14px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;align-items:center;z-index:6}
.introcap .k{font:600 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.introcap h3{margin:0;font:700 17px/1.2 var(--f-display);display:flex;align-items:baseline;gap:8px;min-width:0}
.introcap h3 i{align-self:center}
.introcap h3 i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.introcap h3 span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.introcap h3 small{font:600 11.5px var(--f-num);color:var(--accent);flex:0 0 auto}
.introcap p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.introcap .skip{grid-column:2;grid-row:1 / span 3;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:8px 14px;font:600 12px var(--f-ui);cursor:pointer;color:var(--ink)}
.introcap .prog{grid-column:1 / -1;margin-top:6px}
.introcap .k,.introcap h3,.introcap p{grid-column:1}
.introcap .hint{font-size:12px;color:var(--muted)}
/* the bubble over the highlighted place; pointing at it (or tapping it) pauses the flight and opens details */
.ibubble{position:absolute;left:0;top:0;z-index:4;pointer-events:auto;will-change:transform;transition:opacity .2s}
.ibubble[hidden]{display:none}
.ibubble .bb{position:relative;display:grid;gap:3px;width:max-content;min-width:150px;max-width:250px;padding:9px 12px 10px;border-radius:14px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);
  color:var(--ink);border:1px solid color-mix(in srgb,#fff 12%,transparent);box-shadow:0 12px 32px rgba(0,0,0,.32),0 1px 2px rgba(0,0,0,.25);
  transform-origin:50% 100%;animation:bpop .34s cubic-bezier(.2,1.35,.4,1);cursor:pointer}
.ibubble .bb::after{content:"";position:absolute;left:calc(50% + var(--tx,0px));bottom:-6px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);
  background:color-mix(in srgb,var(--paper) 92%,transparent);border-right:1px solid color-mix(in srgb,#fff 12%,transparent);border-bottom:1px solid color-mix(in srgb,#fff 12%,transparent)}
.ibubble .ring{position:absolute;left:calc(50% + var(--tx,0px));top:100%;margin-top:14px;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--birch);animation:bring 1.6s ease-out infinite;pointer-events:none}
.ibubble .t{display:flex;align-items:center;gap:7px;font:700 13.5px/1.25 var(--f-display)}
.ibubble .t i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.ibubble .t small{margin-left:auto;padding-left:10px;font:600 11px var(--f-num);color:var(--accent);white-space:nowrap}
.ibubble .kk{display:none;font:600 9.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ibubble .more{display:none;font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px}
.ibubble .acts{display:none;gap:6px;margin-top:6px}
.ibubble .acts button{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:999px;padding:6px 11px;font:600 11.5px var(--f-ui);cursor:pointer}
.ibubble .acts button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ibubble.open .bb{max-width:280px;width:280px;animation:none}
.ibubble.below .bb{transform-origin:50% 0}
.ibubble.below .bb::after{bottom:auto;top:-6px;transform:translateX(-50%) rotate(225deg)}
.ibubble.below .ring{top:auto;bottom:100%;margin:0 0 6px}
.ibubble.drop .bb::after,.ibubble.drop .ring{display:none}
.ibubble.open .kk,.ibubble.open .more{display:block}
.ibubble.open .acts{display:flex}
/* the preview over a pin while the mouse points at it; it lets the pointer through, so it never takes the hover away from its pin */
.ibubble.hcard{pointer-events:none}
.ibubble.hcard .bb{width:260px;max-width:260px;cursor:default;animation-duration:.22s}
.ibubble.hcard .kk,.ibubble.hcard .more{display:block}
.ibubble .ev{display:flex;align-items:center;gap:7px;margin-top:5px;font:600 11.5px/1.3 var(--f-ui);color:var(--ink)}
.ibubble .ev b{flex:0 0 auto;font:700 10px var(--f-num);background:var(--birch-soft);color:var(--birch);border-radius:999px;padding:2px 7px}
.ibubble .hint{margin-top:5px;font:500 10.5px var(--f-num);color:var(--muted)}
@keyframes bpop{from{transform:translateY(8px) scale(.86)}to{transform:none}}   /* size only: the bubble never depends on an animation to be visible */
@keyframes bring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
.grab{display:none}
button,a,.chip,.hl,.row,.ev{-webkit-tap-highlight-color:transparent}

.pickhint{left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));padding:9px 14px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;z-index:7;margin-left:200px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;padding:14px 18px;font:600 13px var(--f-ui);display:flex;gap:10px;align-items:center;margin-left:200px}
.loading i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--birch);animation:spin 1s linear infinite}

  .guide.min{--sheetH:calc(58px + env(safe-area-inset-bottom,0px))}

  .sheet-handle::after{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:7px auto 0}
  .tabs{padding:16px 6px 0;touch-action:pan-x}
  .tabs button{padding:7px 8px 10px;font-size:13px}
  .panel{padding:12px max(14px, env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
  .search input{font-size:16px}   /* below 16px iOS zooms the page when the field gets focus */
  .hls{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}

  .placecard .close{top:14px;right:10px;width:38px;height:38px;z-index:2}
  .tools{top:calc(10px + env(safe-area-inset-top,0px))}
  .tools button{width:40px;height:40px}
  .layers{right:calc(var(--gr) + 52px);top:calc(10px + env(safe-area-inset-top,0px));width:min(260px,calc(100% - 84px));max-height:60%;overflow:auto}
  .layers label{padding:8px 4px}
  .foot{top:auto;right:auto;left:var(--gl);bottom:calc(var(--sheetPx,40%) + 8px);font-size:9.5px;flex-wrap:wrap;gap:2px 10px;max-width:calc(100% - var(--gl) - var(--gr))}
  #app[data-sheet="full"] .foot{display:none}
  .tourbar{width:auto;left:var(--gl);right:var(--gr);transform:none;margin-left:0;bottom:calc(var(--sheetPx,58px) + 10px)}
  .introcap{width:auto;left:var(--gl);right:var(--gr);transform:none;margin-left:0;bottom:calc(var(--sheetPx,58px) + 12px);padding:11px 12px 11px 14px}
  .introcap h3{font-size:16px}
  .introcap p{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ibubble .bb{max-width:220px}
  .ibubble.open .bb{width:min(280px,calc(100vw - 32px))}
  .pickhint,.loading{margin-left:0}

}
/* ---------- phones held sideways: a compact side rail instead of a sheet ---------- */
@media (max-height:520px){
  .rail{top:calc(8px + env(safe-area-inset-top,0px));bottom:8px;width:min(300px,42vw);gap:6px}

<script>
// If the 3D module cannot load (WebGL off, CDN blocked), say so instead of leaving a blank board.
window.__kqErr = [];
addEventListener('error', e => window.__kqErr.push(e.message || 'load error'), true);
addEventListener('unhandledrejection', e => window.__kqErr.push(String(e.reason)));
setTimeout(() => {
  if (window.__kqReady) return;
  const el = document.getElementById('loading');
  if (!el) return;
  el.innerHTML = '<span><b>Das 3D-Modell ist nicht gestartet.</b><br>Seite neu laden. Bleibt sie leer, blockiert der Browser WebGL oder den Download von three.js (cdn.jsdelivr.net).<br><small style="color:var(--muted)"></small></span>';
  el.querySelector('small').textContent = window.__kqErr.slice(0, 3).join(' · ');
}, 15000);
</script>

function dec(a, i, n) {

  for (let k = 0; k < n; k++) { x += a[i + 2 * k]; y += a[i + 2 * k + 1]; pts[k] = [x / Q, y / Q]; }
  return [pts, i + 2 * n];
}
const area2 = r => { let s = 0; for (let i = 0; i < r.length; i++) { const a = r[i], b = r[(i + 1) % r.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };

class Acc {
  // opts.base: also keep, per vertex, the ground the piece stands on (this.gv while it is added), for liftGeo(.., 'base')
  constructor(opts = {}) { this.p = []; this.n = []; this.c = opts.color ? [] : null; this.u = opts.uv3 ? [] : null; this.d = opts.delay ? [] : null; this.cat = opts.cat ? [] : null; this.uv = opts.uv ? [] : null; this.g = opts.base ? [] : null; this.gv = 0; }
  v(x, y, z, nx, ny, nz, col, uvw, del, cat, uv) {
    this.p.push(x, y, z); this.n.push(nx, ny, nz);
    if (this.g) this.g.push(this.gv);
    if (this.c) this.c.push(col, col, col);
    if (this.u) this.u.push(uvw[0], uvw[1], uvw[2]);
    if (this.d) this.d.push(del);
    if (this.cat) this.cat.push(cat);
    if (this.uv) this.uv.push(uv[0], uv[1]);
  }
  geo() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    if (this.c) g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    if (this.u) g.setAttribute('aUV', new THREE.Float32BufferAttribute(this.u, 3));
    if (this.d) g.setAttribute('aDelay', new THREE.Float32BufferAttribute(this.d, 1));
    if (this.cat) g.setAttribute('aCat', new THREE.Float32BufferAttribute(this.cat, 1));
    if (this.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    if (this.g) g.userData.g = new Float32Array(this.g);
    g.computeBoundingSphere();

}

// ---------------------------------------------------------------- tours
const tourbar = $('#tourbar');
function startTour(id) {
  const tr = TOURS.find(x => x.id === id); if (!tr) return;
  clearSel(); stopTour();
  // build the full path with leg boundaries
  const pts = [], legEnd = [], stops = [];
  for (const l of tr.legs) {
    for (const p of l.p) if (!pts.length || Math.hypot(p[0] - pts[pts.length - 1][0], p[1] - pts[pts.length - 1][1]) > 0.5) pts.push(p);
    legEnd.push(pts.length - 1); stops.push(l.p[l.p.length - 1]);
  }
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  for (let li = 0; li < tr.legs.length; li++) {
    const l = tr.legs[li]; const acc = new Acc(); addRibbon(acc, l.p, l.mode === 'bus' ? 7 : 4.5, 1.3 + li * 0.01);
    const me = new THREE.Mesh(liftGeo(acc.geo()), l.mode === 'bus' ? busMat : routeMat); me.renderOrder = 4; tourGroup.add(me);
  }
  const total = cum[cum.length - 1];
  const duration = THREE.MathUtils.clamp(total / 1000 * 9000, 14000, 34000);
  state.tour = { tr, pts, cum, legEnd, stops, total, t: 0, duration, playing: true, last: performance.now(), leg: -1 };
  walker.visible = true;
  if (isPhone()) setSheet('min');
  flyTo(G(HOME.x, HOME.y, 0), 1050, { polar: 0.85, dur: 900 });
  renderTourbar(); labelsDirty = true; needsRender = true;
}
function stopTour() {
  if (!state.tour) return;
  state.tour = null; walker.visible = false;
  tourGroup.children.slice().forEach(m => { tourGroup.remove(m); m.geometry.dispose(); });
  tourbar.hidden = true; if (isPhone() && state.sheet === 'min') setSheet('peek'); labelsDirty = true; needsRender = true;
}
function tourPos(d) {
  const T0 = state.tour; let i = 1; while (i < T0.cum.length && T0.cum[i] < d) i++;
  i = Math.min(i, T0.cum.length - 1);
  const a = T0.pts[i - 1], b = T0.pts[i], seg = (T0.cum[i] - T0.cum[i - 1]) || 1, f = (d - T0.cum[i - 1]) / seg;
  return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, i };
}
function renderTourbar() {
  const T0 = state.tour; if (!T0) return;
  const tr = T0.tr; const leg = Math.max(0, T0.leg);
  const l = tr.legs[leg]; const done = T0.t >= 1;
  const txt = done && tr.tail_de ? `<b>${t('tail')}:</b> ${esc(lang === 'en' ? tr.tail_en : tr.tail_de)}` : esc(lang === 'en' ? l.en : l.de);
  tourbar.hidden = false;
  tourbar.innerHTML = `
    <div class="tb-top"><button type="button" class="play" id="tbPlay" aria-label="${T0.playing ? t('pause') : t('play')}">${ico(T0.playing ? 'pause' : 'play')}</button><b>${esc(lang === 'en' ? tr.n_en : tr.n_de)}</b><button type="button" class="x" id="tbX" aria-label="${t('exitTour')}">${ico('x')}</button></div>
    <div class="legs">${tr.legs.map((lg, i) => `<span class="${i < leg || done ? 'done' : i === leg ? 'on' : ''}">${i + 1} · ${esc(stopName(lg.to).split(' (')[0].slice(0, 26))}</span>`).join('')}</div>
    <div class="txt">${txt}</div>
    <div class="prog"><i id="tbProg" style="width:${(T0.t * 100).toFixed(1)}%"></i></div>`;
  $('#tbPlay').onclick = () => { T0.playing = !T0.playing; if (T0.t >= 1 && T0.playing) { T0.t = 0; T0.leg = -1; } T0.last = performance.now(); renderTourbar(); };
  $('#tbX').onclick = stopTour;
}
const camOff = new THREE.Vector3();
function stepTour(now) {
  const T0 = state.tour; if (!T0 || !T0.playing) return false;
  const dt = Math.min(64, now - T0.last); T0.last = now;
  T0.t = Math.min(1, T0.t + dt / T0.duration);
  const d = T0.t * T0.total, pos = tourPos(d);
  walker.userData.p = [pos.x, pos.y]; walker.position.copy(G(pos.x, pos.y, 8));
  let leg = 0; while (leg < T0.legEnd.length - 1 && pos.i > T0.legEnd[leg]) leg++;
  if (leg !== T0.leg || T0.t >= 1) { const ch = leg !== T0.leg; T0.leg = leg; if (ch || T0.t >= 1) renderTourbar(); }
  const pr = $('#tbProg'); if (pr) pr.style.width = (T0.t * 100).toFixed(1) + '%';
  if (!fly) {   // camera follows the walker, keeping the user's angle
    const tgt = G(pos.x, pos.y, 0);
    camOff.copy(camera.position).sub(controls.target);
    controls.target.lerp(tgt, 0.06); camera.position.copy(controls.target).add(camOff);
  }
  if (T0.t >= 1) { T0.playing = false; renderTourbar(); }
  labelsDirty = true;
  return true;
}

const guide = $('#guide');
function setSheet(s) {

  guide.style.removeProperty('height');

$('#sheetToggle').onclick = () => { if (!sheetDrag?.moved) setSheet(state.sheet === 'peek' ? 'full' : 'peek'); };
let sheetDrag = null, eatClick = false;
guide.addEventListener('pointerdown', e => {
  if (!isPhone() || !e.target.closest('.sheet-handle, .tabs')) return;
  sheetDrag = { x: e.clientX, y: e.clientY, h: guide.getBoundingClientRect().height, id: e.pointerId, t: performance.now(), moved: false };
});
guide.addEventListener('pointermove', e => {
  const d = sheetDrag; if (!d || e.pointerId !== d.id) return;
  const dy = e.clientY - d.y, dx = e.clientX - d.x;
  if (!d.moved) { if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(dx)) return; d.moved = true; guide.classList.add('dragging'); guide.setPointerCapture(d.id); }
  guide.style.height = Math.max(58, Math.min(app.clientHeight - 96, d.h - dy)) + 'px';
});
const sheetUp = e => {
  const d = sheetDrag; if (!d || e.pointerId !== d.id) return;
  sheetDrag = null; if (!d.moved) return;
  guide.classList.remove('dragging'); eatClick = true; setTimeout(() => eatClick = false, 60);
  const h = guide.getBoundingClientRect().height, H = app.clientHeight, v = (d.y - e.clientY) / Math.max(1, performance.now() - d.t);
  let s = h < H * 0.24 ? 'min' : h < H * 0.64 ? 'peek' : 'full';
  if (v > 0.5) s = s === 'min' ? 'peek' : 'full'; else if (v < -0.5) s = s === 'full' ? 'peek' : 'min';
  setSheet(s);
};
guide.addEventListener('pointerup', sheetUp); guide.addEventListener('pointercancel', sheetUp);

  $('#bFly').title = t('flyBtnTitle');
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $$('#tools [data-t]').forEach(b => { b.title = t(b.dataset.t); b.setAttribute('aria-label', t(b.dataset.t)); });
  $('#stats').innerHTML = `<span><b>${POIS.length}</b> ${t('places')}</span><span><b>${EVENTS.length}</b> ${t('events')}</span><span><b>${TOURS.length}</b> ${t('walks')}</span><span><b>${nBuildings.toLocaleString('de-CH')}</b> ${t('buildings')}</span>`;
  renderTabs(); renderPanel();
  if (!$('#layers').hidden) renderLayers();
  if (state.sel) { const s = state.sel; if (s.kind === 'poi') selectPoi(s.id, { noFly: true }); else if (s.kind === 'site') { const c = camera.position.clone(), tg = controls.target.clone(); selectSite(s.id); fly = null; camera.position.copy(c); controls.target.copy(tg); } else if (s.kind === 'event') { const c = camera.position.clone(), tg = controls.target.clone(); selectEvent(s.id); fly = null; camera.position.copy(c); controls.target.copy(tg); } }
  if (state.tour) renderTourbar();
  labelPool.forEach(el => el.remove()); labelPool.clear(); labelsDirty = true; needsRender = true;
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('lang', lang); applyLang(); });

// ---------------------------------------------------------------- resize, theme
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h);
  if (!isPhone() && app.dataset.sheet) { delete app.dataset.sheet; guide.classList.remove('min', 'full'); guide.style.removeProperty('height'); }
  else if (isPhone() && !app.dataset.sheet) setSheet(state.sheet);
  refreshInsets();
  if (!resize.done) { vo.x = vo.tx; vo.y = vo.ty; resize.done = true; }   // first layout: no easing
  applyViewOffset();
  if (shortTabs() !== resize.short) { resize.short = shortTabs(); renderTabs(); }
  labelsDirty = true; needsRender = true;
}
new ResizeObserver(resize).observe(app);
new ResizeObserver(refreshInsets).observe(guide);
new ResizeObserver(refreshInsets).observe(card);
new MutationObserver(refreshInsets).observe(card, { attributes: true, attributeFilter: ['hidden'] });
// a host page may set its own data-theme; keep the visitor's choice
new MutationObserver(() => {
  if (document.documentElement.getAttribute('data-theme') !== wantTheme()) applyTheme();
  else { applyPalette(); renderPanel(); }
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- scale bar + compass
function updateHud() {
  const dist = camera.position.distanceTo(controls.target);
  const mpp = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.max(1, canvas.clientHeight);
  const nice = [20, 50, 100, 200, 250, 500, 1000, 2000].find(n => n / mpp >= 60) || 2000;
  $('#scaleBar').style.width = Math.round(nice / mpp) + 'px';
  $('#scaleTxt').textContent = nice >= 1000 ? `${nice / 1000} km` : `${nice} m`;
  const az = controls.getAzimuthalAngle();
  $('#compass svg').style.transform = `rotate(${(az * 180 / Math.PI).toFixed(1)}deg)`;
}

// ---------------------------------------------------------------- loop
let needsRender = true, lastPolar = -1;
controls.addEventListener('change', () => { labelsDirty = true; needsRender = true; });
let growStart = Infinity;   // set on the first rendered frame
function clampTarget() {
  const tx = controls.target.x, ty = -controls.target.z, dx = tx - BC[0], dy = ty - BC[1], d = Math.hypot(dx, dy);
  if (d > R * 0.92) { const k = R * 0.92 / d; const nx = BC[0] + dx * k, ny = BC[1] + dy * k; const off = camera.position.clone().sub(controls.target); controls.target.set(nx, controls.target.y, -ny); camera.position.copy(controls.target).add(off); }
}
// Panning slides the target across the map at the height it had. Keep it at the same height above the ground, so the
// view climbs the slopes instead of aiming into a hill. Flights, the intro and a running walk set the target themselves.
const follow = { x: NaN, z: NaN, lift: 0 };
function followGround() {
  const tg = controls.target;
  if (!TG || fly || intro || state.tour?.playing) { follow.x = NaN; return; }
  if (tg.x === follow.x && tg.z === follow.z) return;
  const gy = ground(tg.x, -tg.z);
  if (Number.isNaN(follow.x)) follow.lift = tg.y - gy;
  else { const d = gy + follow.lift - tg.y; tg.y += d; camera.position.y += d; }
  follow.x = tg.x; follow.z = tg.z;
}
// The relief switch (layers): shift everything that stands on the terrain between the terrain and the flat board.
function setRelief(on) {
  on = TG && on ? 1 : 0;
  if (on === reliefOn) return;
  const tg = controls.target, g0 = ground(tg.x, -tg.z), dOn = on - reliefOn;
  reliefOn = on;
  const seen = new Set();
  scene.traverse(o => {
    const g = o.geometry; if (!g?.userData.lift || seen.has(g)) return;
    seen.add(g); relift(g, dOn, on);
    if (o.isLine && o.material?.isLineDashedMaterial) o.computeLineDistances();
  });
  for (const [ed, src] of ghostEdges) { ed.geometry.dispose(); ed.geometry = new THREE.EdgesGeometry(src, 25); }
  bUni.uRelief.value = on;
  placeTrees(); placeBoard();
  siteGlow.position.copy(siteAt(26));
  if (halo.visible && halo.userData.p) setHalo(...halo.userData.p);
  if (walker.visible && walker.userData.p) walker.position.copy(G(...walker.userData.p, 8));
  if (intro) intro.center.copy(siteAt(12));
  const dy = ground(tg.x, -tg.z) - g0; tg.y += dy; camera.position.y += dy; fly = null; follow.x = NaN;   // stay on the same spot
  updatePins(true); labelsDirty = true; needsRender = true;
}
let bootFly = false;   // the first view: drop in from above to the default view once the model is on screen
function frame(now) {
  requestAnimationFrame(frame);
  let active = false;
  if (bootFly && window.__kqReady) { const d = DEFAULT(); fly = { t0: now + 150, dur: 2400, fromT: controls.target.clone(), fromP: camera.position.clone(), toT: d.target, toP: d.pos }; bootFly = false; }
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);
    controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromP, fly.toP, e);
    if (k >= 1) fly = null; active = true; labelsDirty = true;
  }
  if (intro && stepIntro(now)) active = true;
  if (stepViewOffset()) active = true;
  if (bUni.uGrow.value < 2.2) { bUni.uGrow.value = Math.max(0, (now - growStart) / 2600 * 1.6); active = true; }
  if (stepTour(now)) active = true;
  if (controls.update()) active = true;
  clampTarget(); followGround();
  if (active || needsRender) {
    camera.updateMatrixWorld(); updatePins(); if (labelsDirty) layoutLabels(); updateHud(); if (intro) placeBubble(); if (hcardId) placeHcard();
    renderer.render(scene, camera); needsRender = false;
    if (!window.__kqReady) { window.__kqReady = true; $('#loading').hidden = true; growStart = now + 120; }
    adapt(now);
  }
}
// Slow phone? While frames render back to back, measure them; under ~28 fps first lower the resolution, then drop shadows.
const perf = { last: 0, n: 0, sum: 0, level: 0, off: /[#&?]hq\b/.test(location.href) };
function adapt(now) {
  const dt = now - perf.last; perf.last = now;
  if (perf.off || perf.level >= 2 || dt > 250 || now < growStart + 1500) return;
  perf.sum += dt; if (++perf.n < 45) return;
  const avg = perf.sum / perf.n; perf.n = 0; perf.sum = 0;
  if (avg < 36) return;
  if (!document.documentElement.hasAttribute('data-lowfx')) { document.documentElement.setAttribute('data-lowfx', ''); return; }
  perf.level++;
  if (perf.level === 1) { renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() * 0.6)); resize(); }
  else { sun.castShadow = false; renderer.shadowMap.needsUpdate = true; }
  needsRender = true;
}

// ---------------------------------------------------------------- boot
// W in the test hooks is ground-relative (h metres above the model's ground); Wabs is the raw mapping
window.__kq = { camera, controls, scene, renderer, state, selectPoi, selectSite, selectEvent, startTour, stopTour, flyTo, W: G, Wabs: W, ground, setRelief, relief: () => reliefOn, applyPalette, setNight, setDark: setNight, setSheet, endIntro, startIntro, perf, T: () => state.tour, intro: () => intro };
applyTheme();
$('#ftTer').hidden = !TG;
if (isPhone()) setSheet('peek');
applyLang();
applyLayers();
applyPalette();
resize();
{
  const d = DEFAULT();
  if (reduced || /[#&?]nointro\b/.test(location.href)) { controls.target.copy(d.target); camera.position.copy(d.pos); }
  else { controls.target.copy(G(BC[0], BC[1], 0)); camera.position.copy(W(BC[0] + 300, BC[1] - 900, 5200)); bootFly = true; }
  $('#bFly').onclick = startIntro;
}
controls.update();
requestAnimationFrame(frame);
</script>
